{% extends "tracker/base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<h2>Notifications</h2>
<div class="list-group">
    {% for n in notifications %}
        <div class="list-group-item {% if not n.is_read %}list-group-item-warning{% endif %} d-flex justify-content-between align-items-center">
            <div>
                <strong>{{ n.message }}</strong><br>
                <small class="text-muted">{{ n.created_at }}</small>
            </div>
            {% if not n.is_read %}
                <a href="{% url 'notification_mark_read' n.pk %}" class="btn btn-sm btn-outline-secondary">Mark read</a>
            {% endif %}
        </div>
    {% empty %}
        <p>No notifications yet.</p>
    {% endfor %}
</div>
{% endblock %}
