{% extends "tracker/base.html" %}
{% block title %}Delete Savings Goal{% endblock %}
{% block content %}
<h2>Delete Savings Goal</h2>
<p>Are you sure you want to delete "{{ goal.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'savingsgoal_list' %}">Cancel</a>
</form>
{% endblock %}
