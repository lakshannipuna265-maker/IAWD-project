<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
</head>
<body>
    <header>
        <h1>Personal Finance Tracker</h1>
        <nav>
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}">Dashboard</a> 
                <a href="{% url 'category_list' %}">Categories</a> |
                <a href="{% url 'savingsgoal_list' %}">Savings Goals</a>
                <a href="{% url 'budget_list' %}">Budgets</a>
                <a href="{% url 'transaction_list' %}">Transactions</a>
                <span>Hello, {{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                     {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
            <a href="{% url 'login' %}">Login</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Finance Tracker</p>
    </footer>
</body>
</html>
