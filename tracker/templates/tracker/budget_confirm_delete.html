{% extends "tracker/base.html" %}
{% block title %}Delete Budget{% endblock %}
{% block content %}
<h2>Delete Budget</h2>
<p>Are you sure you want to delete the budget for "{{ budget.category.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'budget_list' %}">Cancel</a>
</form>
{% endblock %}
